[package]
name = "compressy"
version = "0.1.0"
edition = "2024"
description = "Drop a clip in, Claude Code squeezes it as small as it can go."
publish = false

# zgui is young and moves fast: pinned to the commit this was written against.
[dependencies]
zgui = { git = "https://github.com/zeronsh/zgui", rev = "3021fdf2b06142050a620f4e9859ddf472a0a813" }
zgui-desktop = { git = "https://github.com/zeronsh/zgui", rev = "3021fdf2b06142050a620f4e9859ddf472a0a813", features = ["ghostty"] }

# zgui builds with forks of these; a git dependency doesn't carry its [patch].
[patch.crates-io]
cosmic-text = { git = "https://github.com/zeronsh/zgui", rev = "3021fdf2b06142050a620f4e9859ddf472a0a813" }
taffy = { git = "https://github.com/zeronsh/zgui", rev = "3021fdf2b06142050a620f4e9859ddf472a0a813" }
wgpu-hal = { git = "https://github.com/zeronsh/zgui", rev = "3021fdf2b06142050a620f4e9859ddf472a0a813" }
accesskit_macos = { git = "https://github.com/zeronsh/zgui", rev = "3021fdf2b06142050a620f4e9859ddf472a0a813" }
accesskit_windows = { git = "https://github.com/zeronsh/zgui", rev = "3021fdf2b06142050a620f4e9859ddf472a0a813" }
winit = { git = "https://github.com/zeronsh/zgui", rev = "3021fdf2b06142050a620f4e9859ddf472a0a813" }

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
